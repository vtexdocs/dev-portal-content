# This workflow is designed for vtexdocs content repositories.
# Copy to vtexdocs/help-center-content or vtexdocs/dev-portal-content

name: Index Documents

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
  schedule:
    # Weekly safety net: drop index entries for files that no longer exist and index
    # files the push runs missed.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      full_reindex:
        description: 'Reindex all documents'
        required: false
        default: false
        type: boolean
      reconcile:
        description: 'Remove index entries for files no longer in the repo and index missing files'
        required: false
        default: false
        type: boolean

# One run at a time, in push order, so a delete can never overtake a later re-add.
concurrency:
  group: index-documents
  cancel-in-progress: false

env:
  INDEXING_URL: ${{ secrets.INDEXING_URL }}
  INTERNAL_ACCESS_KEY: ${{ secrets.INTERNAL_ACCESS_KEY }}
  REPOSITORY: ${{ github.repository }}
  BRANCH: main

jobs:
  index-documents:
    # This file is a template kept in vtexdocs-mcp-app; only run it from the content repo.
    if: github.repository != 'vtexdocs/vtexdocs-mcp-app'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Compute changed files
        if: github.event_name == 'push' || inputs.full_reindex
        env:
          BEFORE: ${{ github.event.before }}
          FULL_REINDEX: ${{ inputs.full_reindex }}
        run: |
          set -euo pipefail
          to_json() { jq -R -s -c 'split("\n") | map(select(length > 0))'; }

          if [ "$FULL_REINDEX" = "true" ]; then
            find docs \( -name '*.md' -o -name '*.mdx' \) -type f | to_json > .index-files.json
            echo '[]' > .index-deleted.json
            echo "Full reindex: $(jq length .index-files.json) file(s)"
            exit 0
          fi

          # Diff the whole push, not only its last commit. Fall back to the parent commit
          # when the pre-push commit is unavailable (new branch, force push).
          BASE=HEAD~1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            BASE=$BEFORE
          fi
          echo "Diffing $BASE..HEAD"

          # --no-renames reports a move as delete(old) + add(new), so the old path is removed.
          changed() { git -c core.quotepath=false diff --no-renames --name-only --diff-filter="$1" "$BASE" HEAD -- 'docs/**/*.md' 'docs/**/*.mdx'; }
          changed d | to_json > .index-files.json
          changed D | to_json > .index-deleted.json
          echo "To index: $(jq length .index-files.json), to delete: $(jq length .index-deleted.json)"

      - name: Reconcile index with repository
        if: github.event_name == 'schedule' || inputs.reconcile
        run: |
          set -euo pipefail
          # Each call deletes up to `limit` orphaned paths; repeat until none remain.
          for _ in $(seq 1 20); do
            RESP=$(curl -sS --fail-with-body --max-time 300 -X POST "$INDEXING_URL/api/index-documents/reconcile" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Access-Key: $INTERNAL_ACCESS_KEY" \
              -d "$(jq -nc --arg repo "$REPOSITORY" --arg branch "$BRANCH" '{repository: $repo, branch: $branch, dryRun: false, limit: 1000}')")
            echo "$RESP" | jq -c '{repository_docs, indexed_docs, orphaned: (.orphaned | length), missing: (.missing | length), documents_deleted, chunks_deleted, remaining_orphaned}'
            echo "$RESP" | jq -c '.missing' > .index-missing.json
            [ "$(echo "$RESP" | jq '.remaining_orphaned')" = "0" ] && break
          done

          # Index the missing files too (merged with anything a full reindex queued).
          [ -f .index-files.json ] || echo '[]' > .index-files.json
          [ -f .index-deleted.json ] || echo '[]' > .index-deleted.json
          jq -sc 'add | unique' .index-files.json .index-missing.json > .index-merged.json
          mv .index-merged.json .index-files.json
          echo "Missing files to index: $(jq length .index-missing.json)"

      - name: Update index
        if: hashFiles('.index-files.json') != ''
        run: |
          set -uo pipefail
          FAILED=0

          # $1 = body key (files|deleted), $2 = JSON array file, $3 = batch size
          run_batches() {
            local key=$1 list=$2 size=$3 total off batch payload resp code body batch_failed
            total=$(jq length "$list")
            [ "$total" = "0" ] && return
            echo "==> $key: $total path(s) in batches of $size"
            for ((off = 0; off < total; off += size)); do
              batch=$(jq -c ".[$off:$off + $size]" "$list")
              payload=$(jq -nc --argjson b "$batch" --arg key "$key" --arg repo "$REPOSITORY" --arg branch "$BRANCH" \
                '{($key): $b, repository: $repo, branch: $branch}')
              resp=$(curl -sS -w '\n%{http_code}' --max-time 300 -X POST "$INDEXING_URL/api/index-documents" \
                -H "Content-Type: application/json" \
                -H "X-Internal-Access-Key: $INTERNAL_ACCESS_KEY" \
                -d "$payload") || true
              code=$(echo "$resp" | tail -1)
              body=$(echo "$resp" | sed '$d')
              if [ "$code" != "200" ]; then
                echo "::error::$key batch at $off failed with HTTP $code: $body"
                FAILED=$((FAILED + $(echo "$batch" | jq length)))
                continue
              fi
              echo "$key batch at $off: $(echo "$body" | jq -c '{processed, failed, documents_indexed, documents_skipped, documents_deleted, chunks_created, chunks_deleted, duration_ms}')"
              batch_failed=$(echo "$body" | jq '.failed // 0')
              if [ "$batch_failed" != "0" ]; then
                echo "$body" | jq -r '.errors[] | "::error::\(.file): \(.error)"'
                FAILED=$((FAILED + batch_failed))
              fi
            done
          }

          run_batches deleted .index-deleted.json 100
          run_batches files .index-files.json 10

          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED file(s) failed"
            exit 1
          fi
